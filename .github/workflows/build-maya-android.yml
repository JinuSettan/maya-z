name: Build MAYA Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: maya-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools, NDK & CMake
        run: |
          echo "Accepting Android SDK licenses..."
          yes | sdkmanager --licenses || true
          echo "Installing Android SDK platforms, CMake 3.22.1 and NDK..."
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Node & pnpm dependencies
        run: |
          pnpm install --no-frozen-lockfile

      - name: Print Build Environment Diagnostics
        run: |
          echo "=========================================="
          echo "     MAYA CI/CD BUILD DIAGNOSTICS         "
          echo "=========================================="
          echo "Java version:"
          java -version
          echo "------------------------------------------"
          echo "Node version:"
          node -v
          echo "pnpm version:"
          pnpm -v
          echo "------------------------------------------"
          echo "Android SDK root: $ANDROID_HOME"
          echo "Android SDK platforms:"
          ls -la "$ANDROID_HOME/platforms" || true
          echo "Android SDK build-tools:"
          ls -la "$ANDROID_HOME/build-tools" || true
          echo "Android NDK installations:"
          ls -la "$ANDROID_HOME/ndk" || true
          echo "CMake installations:"
          ls -la "$ANDROID_HOME/cmake" || true
          cmake --version || true
          echo "------------------------------------------"
          echo "Gradle wrapper setup:"
          chmod +x ./gradlew
          ./gradlew --version
          echo "=========================================="

      - name: Build Release APK using Gradle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "Starting real Gradle build for MAYA Android..."
          ./gradlew assembleRelease --stacktrace --info

      - name: Locate, Verify and Inspect APK
        id: verify_apk
        run: |
          echo "=========================================="
          echo "      LOCATING GENERATED ANDROID APK      "
          echo "=========================================="
          
          # Find real .apk file generated by Gradle
          APK_FILE=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1)
          
          if [ -z "$APK_FILE" ]; then
            echo "::error::CRITICAL FAILURE: No APK file was found in app/build/outputs/apk!"
            echo "Contents of app/build/outputs:"
            ls -laR app/build/outputs || true
            exit 1
          fi
          
          if [ ! -s "$APK_FILE" ]; then
            echo "::error::CRITICAL FAILURE: Found APK file '$APK_FILE' is 0 bytes!"
            exit 1
          fi
          
          FILE_SIZE=$(stat -c%s "$APK_FILE" 2>/dev/null || stat -f%z "$APK_FILE")
          HUMAN_SIZE=$(ls -lh "$APK_FILE" | awk '{print $5}')
          
          echo "✅ Real APK successfully generated!"
          echo "File Path: $APK_FILE"
          echo "File Size: $FILE_SIZE bytes ($HUMAN_SIZE)"
          echo "SHA256:   $(sha256sum "$APK_FILE" | awk '{print $1}')"
          
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT
          echo "apk_filename=$(basename "$APK_FILE")" >> $GITHUB_OUTPUT
          echo "apk_size=$HUMAN_SIZE" >> $GITHUB_OUTPUT

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: maya-android-apk
          path: ${{ steps.verify_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
