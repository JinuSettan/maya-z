name: Build MAYA Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Verify tools
        run: |
          node --version
          pnpm --version
          java -version

      - name: Install dependencies
        run: |
          pnpm config set dangerouslyAllowAllBuilds true
          pnpm install --config.confirmModulesPurge=false --unsafe-perm

      - name: Expo prebuild
        working-directory: artifacts/maya-mobile
        run: |
          CI=1 pnpm exec expo prebuild --platform android

      - name: Build APK
        working-directory: artifacts/maya-mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maya-ai-apk
          path: artifacts/maya-mobile/android/app/build/outputs/apk/release/*.apk
