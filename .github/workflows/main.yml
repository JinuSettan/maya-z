name: Build MAYA Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/lib/android/sdk/ndk/25*
          sudo docker image prune --all --force

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify tools
        run: |
          node --version
          pnpm --version
          java -version

      - name: Install dependencies
        run: |
          pnpm config set dangerouslyAllowAllBuilds true
          pnpm install --config.confirmModulesPurge=false --unsafe-perm

      - name: Download model
        working-directory: artifacts/maya-mobile
        run: mkdir -p ../../attached_assets/models && wget -O ../../attached_assets/models/qwen2.5-0.5b-instruct-q4_0.gguf https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_0.gguf

      - name: Expo prebuild
        working-directory: artifacts/maya-mobile
        env:
          CI: true
        run: |
          CI=1 pnpm exec expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: artifacts/maya-mobile/android
        env:
          CI: true
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: maya-ai-apk
          path: artifacts/maya-mobile/android/app/build/outputs/apk/release/*.apk
