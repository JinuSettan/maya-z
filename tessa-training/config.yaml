# Starter baseline only. Confirm compatibility before changing the model.
model:
  name: "Qwen/Qwen3-4B-Instruct-2507"
  trust_remote_code: false
  max_seq_length: 1024

data:
  train_file: "tessa-training/data/train.jsonl"
  validation_file: ""
  instruction_field: "instruction"
  context_field: "context"
  response_field: "response"

lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

training:
  output_dir: "tessa-training/output/tessa-qwen3-4b-lora"
  num_train_epochs: 1
  learning_rate: 0.0001
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  logging_steps: 5
  save_steps: 50
  max_steps: 20
  seed: 42
